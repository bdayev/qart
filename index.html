
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYK TEQNO Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#10152f,#303f9f,#7986ff);
    padding: 20px;
}

.card {
    width: 395px;
    max-width: 100%;
    background: #f5f5f7;
    border-radius: 28px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 60px #0008;
}

.logo {
    width: 250px;
    height: auto;
    object-fit: contain;
    margin: 0 auto 15px;
    display: block;
}

h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

.face {
    width: 110px;
    height: 110px;
    margin: 35px auto;
}

.face svg {
    width: 100%;
    height: 100%;
}

.scan {
    animation: scanning 1.5s infinite;
}

@keyframes scanning {
    0% { transform: translateY(0); opacity: .2; }
    50% { opacity: 1; }
    100% { transform: translateY(35px); opacity: .2; }
}

.status {
    margin: 20px 0;
    color: #777;
    min-height: 22px;
}

button {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 15px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.loader {
    width: 35px;
    height: 35px;
    border: 4px solid #ddd;
    border-top: 4px solid #303f9f;
    border-radius: 50%;
    margin: 20px auto;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result {
    display: none;
    margin-top: 25px;
    animation: appear .6s ease;
}

/* HAYK TEQNO DEMO RECEIPT */

.receipt {
    background: white;
    border-radius: 18px;
    padding: 24px 18px;
    text-align: left;
    box-shadow: 0 5px 20px #0001;
    border: 1px dashed #bbb;
}

.receipt-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.receipt-subtitle {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-bottom: 20px;
}

.receipt-line {
    border-top: 1px dashed #ccc;
    margin: 15px 0;
}

.receipt p {
    font-size: 14px;
    color: #444;
    margin: 12px 0;
    line-height: 1.5;
}

.receipt strong {
    color: #222;
}

.receipt-total {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    color: #159447;
    margin: 18px 0;
}

.success {
    text-align: center;
    color: #159447;
    font-weight: bold;
    font-size: 18px;
    margin-top: 18px;
}

.demo {
    color: #999;
    font-size: 10px;
    line-height: 1.6;
    margin-top: 20px;
}

.demo-warning {
    color: #dc2626;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <!-- LOGO -->
    <img
        class="logo"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuBl3UVivf8VFVsha-XgCYsUTlF4Q5jydo-nmrtAyKnRIbXrIBubzR4E4&s=10"
        alt="Logo"
    >

    <h1>Face ID</h1>
    <p class="subtitle">Identity Verification </p>

    <!-- FACE ID -->

    <div class="face" id="face">
        <svg viewBox="0 0 100 100">
            <g fill="none"
               stroke="#111"
               stroke-width="5"
               stroke-linecap="round">

                <path d="M35 10 H20 Q10 10 10 20 V35"/>
                <path d="M65 10 H80 Q90 10 90 20 V35"/>
                <path d="M10 65 V80 Q10 90 20 90 H35"/>
                <path d="M90 65 V80 Q90 90 80 90 H65"/>

                <path d="M35 42 Q50 30 65 42"/>
                <path d="M35 60 Q50 72 65 60"/>

                <path class="scan"
                      d="M15 50 H85"
                      stroke="#2585ff"
                      stroke-width="3"/>
            </g>
        </svg>
    </div>

    <p class="status" id="status">
        Սեղմիր՝ սկանավորումը սկսելու համար
    </p>

    <button id="btn" onclick="verify()">
        Սկսել Face ID
    </button>

    <!-- LOADING -->

    <div id="loading" style="display:none">
        <div class="loader"></div>
        <p>Բեռնում ենք  կտրոնը...</p>
    </div>

    <!-- FINAL RECEIPT -->

    <div class="result" id="result">

        <div class="receipt">

            <div class="receipt-title">
                HAYK TEQNO
            </div>

            <div class="receipt-subtitle">
                Աշխատավարձի վճարման  կտրոն
            </div>

            <div class="receipt-line"></div>

            <p>
                <strong>Վճարող՝</strong>
                HAYK TEQNOLOG
            </p>

            <p>
                <strong>Երկիր՝</strong>
                Աֆրիկա
            </p>

            <p>
                <strong>Նշանակություն՝</strong>
                Աշխատավարձի վճարում
            </p>

            <div class="receipt-line"></div>

            <p style="text-align:center">
                <strong>Աշխատավարձի գումար</strong>
            </p>

            <div class="receipt-total">
                483,800 ֏
            </div>

            <div class="receipt-line"></div>

            <div class="success">
                ✓  SUCCESS
            </div>

        </div>

        <p class="demo-warning" style="margin-top:15px;font-size:11px">
             ԿՏՐՈՆ
            <br>
            ՎՃԱՐՈՒՄ 
        </p>

    </div>

    <p class="demo">
      
        <br>
       
        <br>
       
        <br>
        ՖԻՆԱՆՍԱԿԱՆ ԿՏՐՈՆ
    </p>

</div>

<script>
function verify() {

    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const face = document.getElementById("face");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    btn.disabled = true;
    btn.innerText = "Սկանավորում...";

    status.innerText = "Face ID-ի դեմո սկանավորում...";

    setTimeout(() => {

        face.innerHTML = `
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40"
                    fill="none"
                    stroke="#16a34a"
                    stroke-width="5"/>

                <path d="M28 51 L44 66 L73 35"
                    fill="none"
                    stroke="#16a34a"
                    stroke-width="7"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>
        `;

        status.innerText = "✓ Դեմո սկանավորումն ավարտված է";
        status.style.color = "#16a34a";

        btn.style.display = "none";

        setTimeout(() => {

            face.style.display = "none";
            status.style.display = "none";
            loading.style.display = "block";

            setTimeout(() => {

                loading.style.display = "none";
                result.style.display = "block";

            }, 2500);

        }, 1000);

    }, 3000);
}
</script>

</body>
</html>
